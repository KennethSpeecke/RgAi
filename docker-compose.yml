services:
  llm:
    image: ollama/ollama:latest
    container_name: rgai-llm
    command: ["serve"]
    ports:
      - "11434:11434"
    volumes:
      - D:\Docker\volumes\llm_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=mistral
      # GPU Configuration
      - CUDA_VISIBLE_DEVICES=0
      - OLLAMA_GPU=1
    networks:
      - rgai_network
    restart: unless-stopped
    # GPU Support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /root/.ollama/id_ed25519 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rgai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - D:\Docker\volumes\qdrant_data:/qdrant/storage
      - D:\Docker\volumes\qdrant_snapshots:/qdrant/snapshots
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-your-api-key-here}
    networks:
      - rgai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /qdrant/storage/qdrant.lock || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rgai-backend
    ports:
      - "8000:8000"
    depends_on:
      llm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - LLM_HOST=llm
      - LLM_PORT=11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-your-api-key-here}
      - LOG_DIR=/app/data/logs
      - CACHE_DIR=/app/data/cache
      - UPLOADS_DIR=/app/data/uploads
      - ASPNETCORE_URLS=http://+:8000
    volumes:
      - D:\Docker\volumes\backend_logs:/app/data/logs
      - D:\Docker\volumes\backend_cache:/app/data/cache
      - D:\Docker\volumes\shared_uploads:/app/data/uploads
      - D:\code:/app/code:ro
    networks:
      - rgai_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rgai-frontend
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      - backend
    environment:
      - ApiBaseUrl=http://backend:8000
      - ASPNETCORE_URLS=http://+:80
    networks:
      - rgai_network
    restart: unless-stopped

networks:
  rgai_network:
    driver: bridge
